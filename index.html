<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noi compriamo Enrico Papi .it</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 2;
            transition: opacity 0.5s ease;
        }
        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: 700;
            line-height: 1.4;
            padding: 0 10px;
        }
        .btn-papi {
            background-color: #ffcc00;
            color: #000000;
            font-size: 22px;
            font-weight: bold;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-papi:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
        }
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            display: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container" id="mainInterface">
        <h1>Scopri cosa vuole Enrico Papi da te</h1>
        <button class="btn-papi" id="playBtn">Scoprilo ora 🎬</button>
    </div>

    <div class="video-wrapper" id="videoContainer">
        <!-- Aggiunti attributi di sblocco nativi per i telefoni -->
        <video id="papiVideo" loop playsinline webkit-playsinline muted></video>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const mainInterface = document.getElementById('mainInterface');
        const videoContainer = document.getElementById('videoContainer');
        const papiVideo = document.getElementById('papiVideo');

        const videoSources = ['papi', 'papi.mp4', 'papi.MP4', 'papi.mov', 'papi.MOV'];
        let currentSourceIndex = 0;

        function tryLoadVideo() {
            if (currentSourceIndex < videoSources.length) {
                papiVideo.src = videoSources[currentSourceIndex];
                papiVideo.load();
            }
        }

        papiVideo.addEventListener('error', () => {
            currentSourceIndex++;
            tryLoadVideo();
        });

        tryLoadVideo();

        playBtn.addEventListener('click', () => {
            mainInterface.style.opacity = '0';
            setTimeout(() => {
                mainInterface.style.display = 'none';
                videoContainer.style.display = 'block';
                
                // Trucco per sbloccare l'audio sui telefoni Android/iOS
                papiVideo.muted = false;
                papiVideo.volume = 1.0;
                
                // Tenta la riproduzione forzata
                const playPromise = papiVideo.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Il browser richiede un secondo tocco:", error);
                        // Se fallisce ancora, riprova forzando il muto e riattivando l'audio subito dopo
                        papiVideo.muted = true;
                        papiVideo.play().then(() => {
                            setTimeout(() => { papiVideo.muted = false; }, 50);
                        });
                    });
                }

                // Schermo intero automatico
                if (papiVideo.requestFullscreen) {
                    papiVideo.requestFullscreen().catch(() => {});
                } else if (papiVideo.webkitRequestFullscreen) {
                    papiVideo.webkitRequestFullscreen().catch(() => {});
                } else if (papiVideo.webkitEnterFullscreen) {
                    papiVideo.webkitEnterFullscreen();
                }
                
            }, 500);
        });
    </script>
</body>
</html>
